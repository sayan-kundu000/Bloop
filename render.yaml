services:
  # Backend FastAPI Web Service
  - type: web
    name: bloop-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Bloop
      - key: APP_VERSION
        value: 0.1.0
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: bloop-postgres
          property: connectionString
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://bloop.vercel.app"
      - key: AUDIO_STORAGE_PATH
        value: "backend/app/storage/audio"
      - key: LOG_LEVEL
        value: "INFO"
      - key: QUANTUM_ENABLED
        value: "true"

databases:
  # Managed PostgreSQL 16 Database
  - name: bloop-postgres
    databaseName: bloop_db
    user: bloop_user
    plan: free
